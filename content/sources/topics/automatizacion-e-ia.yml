id: automatizacion-e-ia-01
name: Automatización e inteligencia artificial
category: automatizacion-e-ia
topics:
  - id: cuando-automatizar-un-proceso
    title: Cuándo automatizar un proceso y cuándo no
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - gerentes
    objective: Ayudar a priorizar qué automatizar primero según impacto y riesgo.
    notes:
      - Incluir un criterio simple de priorización (volumen, repetitividad,
        costo del error).
  - id: riesgos-de-usar-ia-sin-supervision
    title: Riesgos de usar IA sin supervisión humana
    status: published
    intent: informational
    funnelStage: consideration
    audience:
      - empresarios
      - gerentes
    objective: Ayudar a detectar riesgos operativos y legales de automatizar
      decisiones sin revisión humana.
    notes:
      - No inventar casos legales reales — señalar que cada jurisdicción es
        distinta y requiere asesoría propia.
  - id: como-elegir-un-proveedor-de-automatizacion
    title: Cómo elegir un proveedor de automatización
    status: published
    intent: commercial
    funnelStage: decision
    audience:
      - founders
      - empresarios
    objective: Dar criterios concretos para evaluar y comparar proveedores de
      automatización o IA.
    notes:
      - Conectar con la categoría proveedores-tecnologicos si corresponde en un
        artículo relacionado.
  - id: que-tareas-se-pueden-automatizar-con-ia
    title: Qué tareas de una empresa se pueden automatizar con inteligencia artificial
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - empresarios
      - gerentes
    objective: Dar ejemplos concretos de tareas automatizables con IA hoy, sin
      exagerar capacidades.
    notes:
      - "Categorizar por área: atención al cliente, ventas, operaciones,
        reporting."
  - id: ia-generativa-vs-automatizacion
    title: "IA generativa versus automatización: cuándo usar cada una"
    status: published
    intent: informational
    funnelStage: consideration
    audience:
      - founders
      - gerentes
    objective: Aclarar la diferencia entre automatizar un proceso fijo y usar IA
      para tareas que requieren criterio.
    notes:
      - "Usar ejemplos: automatizar envío de facturas vs. redactar respuestas
        personalizadas a clientes."
  - id: automatizacion-tradicional-vs-agentes-ia
    title: Diferencia entre automatización tradicional y agentes de IA
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - empresarios
      - gerentes
    objective: Explicar con ejemplos cuándo usar reglas fijas y cuándo un agente con
      criterio.
    notes:
      - Automatización tradicional = flujo predefinido. Agente IA = decide según
        contexto.
  - id: cinco-automatizaciones-simples-ahorrar-horas
    title: Cinco automatizaciones simples que pueden ahorrar horas cada semana
    status: published
    intent: commercial
    funnelStage: consideration
    audience:
      - empresarios
      - gerentes
    objective: Dar ejemplos concretos de automatizaciones de alto impacto y baja
      complejidad.
    notes:
      - "Ejemplos: notificaciones automáticas, reportes programados,
        clasificación de correos, recordatorios."
