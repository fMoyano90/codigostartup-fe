    status: published
    intent: informational
    funnelStage: consideration
    audience:
      - founders
      - empresarios
    objective: Dar un marco simple para estimar costos y anticipar variables que
      suelen quedar fuera de una cotización inicial.
    notes:
      - No inventar cifras ni rangos de precio concretos — hablar en términos de
        variables y criterios, no de montos.
