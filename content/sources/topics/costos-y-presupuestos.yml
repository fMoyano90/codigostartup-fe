    status: published
    intent: commercial
    funnelStage: consideration
    audience:
      - founders
      - empresarios
      - gerentes
    objective: Ayudar a elegir el modelo de cobro adecuado según el nivel de certeza
      del alcance.
    notes:
      - "Explicar el trade-off: alcance muy definido favorece presupuesto
        cerrado, alcance incierto favorece horas."
