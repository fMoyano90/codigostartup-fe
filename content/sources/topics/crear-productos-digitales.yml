id: crear-productos-digitales-01
name: Crear productos digitales
category: crear-productos-digitales
topics:
  - id: como-definir-el-alcance-de-un-mvp
    title: Cómo definir el alcance de un MVP sin quedarte corto ni excederte
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Ayudar a decidir qué incluir y qué dejar fuera de la primera versión
      de un producto digital.
    notes:
      - Distinguir entre "mínimo" y "incompleto" — un MVP bien recortado sigue
        resolviendo el problema real.
  - id: de-la-idea-al-primer-prototipo
    title: "De la idea al primer prototipo: qué validar antes de programar"
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Ayudar a estructurar los pasos previos al desarrollo para reducir el
      riesgo de construir algo equivocado.
    notes:
      - Puede enlazar con que-validar-antes-de-desarrollar-una-aplicacion (ya
        publicado) como artículo relacionado.
  - id: app-web-o-automatizacion
    title: Cómo saber si tu idea necesita una app, una web o solo una automatización
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Ayudar a decidir qué tipo de solución técnica es la adecuada según el
      problema, el usuario y el presupuesto.
    notes:
      - No asumir que todo necesita una app — a veces un formulario o una
        automatización simple resuelve mejor.
  - id: como-validar-una-idea-sin-construir-el-producto
    title: Cómo validar una idea sin construir el producto completo
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Dar métodos concretos de validación temprana que no requieran
      desarrollo completo.
    notes:
      - Incluir conceptos como prototipos en papel, entrevistas, landing pages,
        smoke tests.
  - id: etapas-reales-para-construir-un-producto-tecnologico
    title: Las etapas reales para construir un producto tecnológico
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Describir las fases típicas de desarrollo de un producto digital,
      desde la idea hasta el lanzamiento.
    notes:
      - No prometer plazos fijos — hablar de etapas y su propósito, no de
        timelines.
  - id: mvp-que-incluir-que-dejar-fuera
    title: "MVP: qué debe incluir y qué deberías dejar fuera"
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Ayudar a priorizar funcionalidades para una primera versión que ya
      entregue valor.
    notes:
      - Enfocar en criterios de decisión, no en listas genéricas de features.
  - id: senales-idea-no-esta-lista
    title: Señales de que tu idea todavía no está lista para desarrollarse
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Ayudar a detectar si una idea necesita más validación antes de
      invertir en desarrollo.
    notes:
      - "Señales: no hay usuarios concretos, el problema no está definido, no
        hay métrica de éxito."
  - id: no-necesita-mas-tecnologia-sino-mejores-procesos
    title: "Tu empresa no necesita más tecnología: necesita resolver mejor sus
      procesos"
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - empresarios
      - gerentes
    objective: Cuestionar la automatización prematura y proponer mejorar procesos
      antes de digitalizar.
    notes:
      - "Tema transversal. Evitar el discurso anti-tecnología — el punto es el
        orden correcto: proceso → tecnología."
  - id: que-validar-antes-de-invertir-en-desarrollo
    title: Qué validar antes de invertir en desarrollar un producto digital
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - founders
      - emprendedores
    objective: Listar las validaciones mínimas que reducen el riesgo de invertir en
      un producto que el mercado no necesita.
    notes: []
  - id: app-funciona-no-significa-lista-para-venta
    title: Que una aplicación funcione no significa que esté lista para venderse
    status: published
    intent: informational
    funnelStage: consideration
    audience:
      - founders
      - emprendedores
    objective: Explicar la diferencia entre 'técnicamente funcional' y
      'comercialmente viable'.
    notes: []
  - id: ia-no-arregla-procesos-desordenados
    title: La inteligencia artificial no arregla procesos desordenados
