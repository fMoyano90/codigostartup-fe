topics:
  - id: preguntas-antes-de-contratar-un-proveedor-tecnologico
    title: Preguntas que debes hacer antes de contratar un proveedor tecnológico
    status: published
    intent: commercial
    funnelStage: decision
    audience:
      - founders
      - empresarios
    objective: Dar un checklist de preguntas que reduzcan el riesgo de elegir mal un
      proveedor.
    notes:
      - Enfocar en preguntas sobre proceso, comunicación y entregables — no solo
        precio.
  - id: senales-de-alerta-en-una-propuesta-comercial
    title: Señales de alerta en una propuesta comercial de desarrollo
    status: published
    intent: informational
    funnelStage: consideration
    audience:
      - founders
      - empresarios
      - gerentes
    objective: Ayudar a detectar propuestas poco serias o mal dimensionadas antes de
      firmar.
    notes:
      - "Ejemplos de señales: alcance ambiguo, plazos irreales, ausencia de
        hitos o de plan de mantenimiento."
  - id: como-elegir-una-empresa-de-desarrollo-de-software
    title: Cómo elegir una empresa de desarrollo de software
    status: published
    intent: commercial
    funnelStage: decision
    audience:
      - founders
      - empresarios
    objective: Dar criterios estructurados para evaluar y seleccionar un equipo de
      desarrollo.
    notes:
      - "Ir más allá del precio: evaluar comunicación, proceso, referencias
        verificables, documentación."
  - id: freelancer-agencia-o-equipo-interno
    title: "Freelancer, agencia o equipo interno: cuál conviene"
    status: published
    intent: commercial
    funnelStage: decision
    audience:
      - founders
      - empresarios
      - gerentes
    objective: Comparar los tres modelos según tipo de proyecto, presupuesto y riesgo.
    notes:
      - No posicionar uno como siempre mejor — depende del contexto del proyecto.
  - id: como-evitar-depender-de-un-proveedor
    title: Cómo evitar depender completamente de un proveedor tecnológico
    status: published
    intent: commercial
    funnelStage: decision
    audience:
      - founders
      - empresarios
    objective: Dar medidas prácticas para reducir el vendor lock-in desde el inicio
      de un proyecto.
    notes:
      - Acceso al código, documentación, cuentas cloud, conocimiento transferido
        al cliente.
  - id: que-debe-contener-contrato-desarrollo-software
    title: Qué debería contener un contrato de desarrollo de software
    status: published
    intent: commercial
    funnelStage: decision
    audience:
      - founders
      - empresarios
    objective: Listar cláusulas y puntos clave que protegen al cliente en un
      contrato de desarrollo.
    notes:
      - No dar asesoría legal — listar temas que deberían estar cubiertos, no
        redactar cláusulas.
