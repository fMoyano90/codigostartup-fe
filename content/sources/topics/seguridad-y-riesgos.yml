topics:
  - id: riesgos-tecnicos-que-nadie-revisa-hasta-que-es-tarde
    title: Riesgos técnicos que nadie revisa hasta que ya generaron una pérdida
    status: published
    intent: informational
    funnelStage: awareness
    audience:
      - empresarios
      - gerentes
    objective: Ayudar a identificar riesgos técnicos comunes que se ignoran hasta
      que causan un problema real.
    notes:
      - No inventar incidentes reales ni cifras de pérdidas — hablar en términos
        de categorías de riesgo.
